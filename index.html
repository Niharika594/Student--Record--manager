<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Record Manager</h1>
        <p class="subtitle">Add, save and manage student records</p>

        <div class="form-box">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="input-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="Enter Student ID">
                </div>

                <div class="input-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter Student Name">
                </div>

                <div class="input-group">
                    <label for="studentEmail">Email</label>
                    <input type="text" id="studentEmail" placeholder="Enter Email">
                </div>

                <div class="input-group">
                    <label for="studentCourse">Course</label>
                    <input type="text" id="studentCourse" placeholder="Enter Course">
                </div>

                <div class="input-group">
                    <label for="studentAge">Age</label>
                    <input type="number" id="studentAge" placeholder="Enter Age">
                </div>

                <button type="submit">Add Student</button>

            </form>

            <p id="message"></p>

        </div>

        <div class="actions">

            <button onclick="saveToFile()">Save Data to File</button>

            <label class="file-button">
                Read Student Data
                <input type="file" id="fileInput" accept=".json" onchange="readFromFile(event)">
            </label>

            <button onclick="clearAllStudents()" class="danger">
                Clear All
            </button>

        </div>

        <div class="records">

            <h2>Student Records</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

            <p id="emptyMessage">No student records available.</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
